# Postiz is an optional sidecar. For a complete supported stack, pin and use:
# https://github.com/gitroomhq/postiz-docker-compose/blob/main/docker-compose.yaml
# Do not paste production secrets into this file.
services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    environment:
      MAIN_URL: ${POSTIZ_MAIN_URL:-http://localhost:4007}
      FRONTEND_URL: ${POSTIZ_FRONTEND_URL:-http://localhost:4007}
      NEXT_PUBLIC_BACKEND_URL: ${POSTIZ_BACKEND_URL:-http://localhost:4007/api}
      BACKEND_INTERNAL_URL: ${POSTIZ_INTERNAL_URL:-http://postiz:3000}
      DATABASE_URL: ${POSTIZ_DATABASE_URL:?set through the runtime secret store}
      REDIS_URL: ${POSTIZ_REDIS_URL:?set through the runtime secret store}
      JWT_SECRET: ${POSTIZ_JWT_SECRET:?set through the runtime secret store}
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
    volumes:
      - postiz-config:/config
      - postiz-uploads:/uploads
    ports:
      - "127.0.0.1:${POSTIZ_HOST_PORT:-4007}:5000"
    restart: unless-stopped

volumes:
  postiz-config:
  postiz-uploads:
